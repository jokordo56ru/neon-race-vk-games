const translationPairs=Object.entries(TRANSLATIONS).sort((a,b)=>b[0].length-a[0].length);
function translateText(value){
  let text=String(value??'');
  if(currentLanguage!=='en')return text;
  for(const [ru,en] of translationPairs)text=text.split(ru).join(en);
  return text;
}
function translateMarkup(markup){return translateText(markup)}

    vkSdk.storage.set('neonRaceProfile_vk_v1',JSON.parse(JSON.stringify(profile)));
    cloudQueued=false;
    if(vkFlushBusy)return (await vkSdk.storage.flush())?.success===true;
    vkFlushBusy=true;

    setSaveStatus('Не удалось сохранить в облако VK. Локальный прогресс сохранён.');
    return false;
  }catch(e){console.warn('VK cloud save failed',e);setSaveStatus('Не удалось сохранить в облако VK. Локальный прогресс сохранён.');return false}

async function createVKPlatformSdk(bridge){
  if(!bridge||typeof bridge.send!=='function')throw new Error('VK Bridge is not available');
  await bridge.send('VKWebAppInit',{});
  const query=new URLSearchParams(location.search);
  const hash=new URLSearchParams(String(location.hash||'').replace(/^#/,''));
  const isOK=query.get('vk_client')==='ok'||hash.get('vk_client')==='ok';
  const cloudKey='neonRaceProfile_vk_v1';
  const cache=Object.create(null);
  let writeQueue=Promise.resolve();

  try{
    const response=await bridge.send('VKWebAppStorageGet',{keys:[cloudKey]});
    const rows=Array.isArray(response?.keys)?response.keys:[];
    const row=rows.find(item=>item?.key===cloudKey);
    if(row&&row.value!==undefined&&row.value!==null){
      try{cache[cloudKey]=JSON.parse(row.value)}catch(_){cache[cloudKey]=row.value}
    }
  }catch(error){console.warn('VK Bridge storage read unavailable; local save remains active',error)}

  async function supports(method){
    try{
      if(typeof bridge.supportsAsync==='function')return await bridge.supportsAsync(method);
      if(typeof bridge.supports==='function')return bridge.supports(method);
    }catch(error){console.info('VK Bridge capability check failed:',method,error)}
    return false;
  }
  const adMethodsSupported=await supports('VKWebAppCheckNativeAds')&&await supports('VKWebAppShowNativeAds');
  let lastInterstitialAt=0;
  function makeAd(format){
    return {
      isSupported:adMethodsSupported,
      async canShow(){
        if(!adMethodsSupported)return false;
        if(format==='interstitial'&&Date.now()-lastInterstitialAt<120000)return false;
        const available=await bridge.send('VKWebAppCheckNativeAds',{ad_format:format});
        return available?.result===true;
      },
      async show(){
        if(!adMethodsSupported)return {rendered:false,reward:false,reason:'NOT_SUPPORTED'};
        const response=await bridge.send('VKWebAppShowNativeAds',{ad_format:format});
        const rendered=response?.result===true;
        if(rendered&&format==='interstitial')lastInterstitialAt=Date.now();
        return {rendered,reward:format==='reward'&&rendered,reason:rendered?undefined:'NOT_RENDERED'};
      }
    };
  }

  return {
    platform:isOK?'ok':'vk',
    player:{isAuthorized:true,id:query.get('vk_user_id')||hash.get('vk_user_id')||null},
    storage:{
      get(key){return Object.prototype.hasOwnProperty.call(cache,key)?cache[key]:null},
      set(key,value){
        const serialized=typeof value==='string'?value:JSON.stringify(value);
        cache[key]=value;
        writeQueue=writeQueue.catch(()=>{}).then(async()=>{
          const response=await bridge.send('VKWebAppStorageSet',{key,value:serialized});
          if(response?.result===false)throw new Error('VK storage rejected the write');
          return response;
        });
        writeQueue.catch(error=>{vkStorageError='VK_STORAGE_ERROR';console.warn('VK Bridge storage write failed',error)});
        return true;
      },
      async flush(){
        try{await writeQueue;return {success:true}}
        catch(error){return {success:false,reason:'VK_STORAGE_ERROR',error:String(error?.message||error)}}
      }
    },
    ads:{rewarded:makeAd('reward'),fullscreen:makeAd('interstitial')},
    on(){return ()=>{}},
    gameStarted(){/* VK Mini Apps does not require a separate gameStarted call. */}
  };
}

async function showFullscreenAdBetweenRuns(){
  const prefix='[NEON-RACE][Fullscreen]';
  if(!vkSdk){
    console.info(prefix,'skipped: VK SDK is not initialized');
    return false;
  }
  const ad=vkSdk.ads?.fullscreen;
  if(!ad){
    console.warn(prefix,'SDK does not expose ads.fullscreen');
    return false;
  }
  console.info(prefix,'availability check',{isSupported:ad.isSupported});
  if(!ad.isSupported){
    console.info(prefix,'skipped: NOT_SUPPORTED');
    return false;
  }
  try{
    const canShow=await ad.canShow();
    console.info(prefix,'canShow() returned',canShow);
    if(!canShow){
      console.info(prefix,'skipped: canShow() returned false (cooldown or temporary unavailability)');
      return false;
    }
    // Write the just-finished run to VK storage before opening the ad overlay.
    if(vkSdk.storage)await syncVKCloud(false);
    // Gameplay is already stopped by finishRun(); pause Web Audio during the ad.
    if(audio&&audio.state==='running')await audio.suspend().catch(()=>{});
    console.info(prefix,'calling show()');
    const result=await ad.show();
    console.info(prefix,'show() result',result);
    if(result?.rendered===true){
      console.info(prefix,'fullscreen slot was rendered');
      return true;
    }
    console.warn(prefix,'fullscreen slot was not rendered',result?.reason||'UNKNOWN');
    return false;
  }catch(error){
    console.warn(prefix,'fullscreen request failed; continuing to results',error);
    return false;
  }finally{
    if(soundOn&&audio&&audio.state==='suspended')await audio.resume().catch(()=>{});
  }
}

$('pauseBtn').onclick=()=>{if(state==='play')pauseRun()};
$('soundBtn').onclick=()=>setSoundEnabled(!soundOn);$('menuSoundBtn').onclick=()=>setSoundEnabled(!soundOn);updateSoundButtons();
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup','arrowdown','a','d','w','s',' '].includes(k))e.preventDefault();keys[k]=true;if(e.key==='Escape'||k==='p'){if(state==='play')pauseRun();else if(state==='paused')pauseRun()}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
let pointerDown=false;function movePlayerToPointer(e){if(state!=='play')return;player.x=e.clientX;player.y=e.clientY;clampPlayer()}
canvas.addEventListener('pointerdown',e=>{if(state!=='play')return;pointerDown=true;try{canvas.setPointerCapture(e.pointerId)}catch(_){}movePlayerToPointer(e)});
canvas.addEventListener('pointermove',e=>{if(pointerDown)movePlayerToPointer(e)});
canvas.addEventListener('pointerup',()=>pointerDown=false);canvas.addEventListener('pointercancel',()=>pointerDown=false);
function bindHoldButton(id,key){const el=$(id);const stop=()=>{keys[key]=false};el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;try{el.setPointerCapture(e.pointerId)}catch(_){}});el.addEventListener('pointerup',stop);el.addEventListener('pointercancel',stop);el.addEventListener('lostpointercapture',stop);el.addEventListener('contextmenu',e=>e.preventDefault())}
bindHoldButton('leftBtn','left');bindHoldButton('rightBtn','right');bindHoldButton('upBtn','up');bindHoldButton('downBtn','down');
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    if(state==='play'){pausedByUser=false;pausedByPlatform=true;pauseInterface(true)}
    stopMusic();if(audio?.state==='running')audio.suspend().catch(()=>{});
    if(vkSdk?.storage&&(!vkLastFlushAt||Date.now()-vkLastFlushAt>=30000)&&!vkFlushBusy){syncVKCloud(true).catch(e=>console.warn('VK background flush failed',e))}
  }else if(state==='paused'&&pausedByPlatform){pausedByPlatform=false;platformPaused=false;resumeInterface(true)}
});
addEventListener('pagehide',()=>{
  saveLocal();
  if(vkSdk?.storage){
    try{vkSdk.storage.set('neonRaceProfile_vk_v1',JSON.parse(JSON.stringify(profile)));const pending=vkSdk.storage.flush();if(pending&&typeof pending.catch==='function')pending.catch(e=>console.warn('VK flush on pagehide failed',e))}catch(e){console.warn('VK cloud save on pagehide failed',e)}
  }
  gameplayStop();
});
applyLanguageShell();updateWallet();renderScreen();loadSDK();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
